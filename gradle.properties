org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Daemon Kotlin plafonné : sans ça il s'auto-dimensionne et pousse la box 4 Go
# au swap pendant un build (gradle 2 Go + kotlin + services live).
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Daemon réactivé côté script de build (apk-builder.sh) : accélère les rebuilds
# rapprochés. Idle-timeout court (3 min) pour libérer la RAM vite entre deux
# releases sur ce serveur qui héberge aussi les autres services live.
org.gradle.daemon.idletimeout=180000
# R8 « full mode » désactivé : shrink/obfuscation moins agressifs mais nettement
# plus rapide sur cette VM à 4 Go de RAM ; acceptable pour une app privée.
android.enableR8.fullMode=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# Requis tant que KSP (Room) n'est pas compatible avec le Kotlin intégré d'AGP 9 :
# newDsl/builtInKotlin sont couplés, et le nouveau DSL exige le Kotlin intégré, que
# KSP 2.2.10-2.0.2 ne supporte pas encore (testedVariantArtifacts indisponible).
android.builtInKotlin=false
android.newDsl=false
ksp.useKSP2=false
